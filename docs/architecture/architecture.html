:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
body{ height:100%; margin:0; background:var(--canvas); color:var(--ink); font:14px/1.45 var(--font); overflow:hidden; display:flex; flex-direction:column; }
button{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--dep); outline-offset:2px; }

/* Top bar */
.bar{ display:flex; align-items:center; gap:12px; padding:8px 12px; background:var(--surface); border-bottom:1px solid var(--line); flex-wrap:wrap; }
.title{ display:flex; flex-direction:column; min-width:0; margin-right:auto; }
.title strong{ font-size:16px; line-height:1.2; }
.title span{ font-size:12px; color:var(--muted); }
.search{ position:relative; flex:0 1 320px; min-width:180px; }
.search input{ width:100%; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:var(--canvas); color:var(--ink); font:inherit; }
.results{ position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:30; margin:0; padding:4px; list-style:none; background:var(--surface); border:1px solid var(--line); border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.18); max-height:60vh; overflow:auto; display:none; }
.results.open{ display:block; }
.results li{ padding:6px 8px; border-radius:6px; cursor:pointer; display:flex; flex-direction:column; }
.results li[aria-selected="true"], .results li:hover{ background:var(--l3); }
.results .r-name{ font-weight:600; }
.results .r-sub{ font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tools{ display:flex; gap:6px; flex-wrap:wrap; }
.btn{ padding:6px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface); cursor:pointer; white-space:nowrap; }
.btn:hover{ background:var(--l3); }
.since{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); }
.since select{ padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); font:inherit; max-width:240px; }

/* Breadcrumb */
.crumbs{ display:flex; align-items:center; gap:4px; padding:6px 12px; font-size:13px; color:var(--muted); background:var(--surface); border-bottom:1px solid var(--line); overflow-x:auto; white-space:nowrap; min-height:33px; }
.crumbs button{ border:0; background:none; padding:2px 4px; border-radius:4px; cursor:pointer; color:var(--ink); }
.crumbs button:hover{ background:var(--l3); }
.crumbs .sep{ color:var(--stroke); }
.crumbs .current{ font-weight:600; }

/* Main area */
main{ flex:1; display:flex; min-height:0; }
.stage{ position:relative; flex:1; min-width:0; overflow:hidden; background-color:var(--canvas); background-image:radial-gradient(var(--dot) 1px, transparent 1.2px); }
svg#svg{ width:100%; height:100%; display:block; touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none; }
svg#svg.dragging{ cursor:grabbing; }

/* Boxes */
.box{ cursor:pointer; }
.box .shape{ stroke:var(--stroke); stroke-width:1; }
.box.lvl-System .shape{ fill:var(--l1); stroke-width:2; }
.box.lvl-Container .shape{ fill:var(--l2); stroke-width:1.6; }
.box.lvl-Module .shape{ fill:var(--l3); }
.box.lvl-File .shape{ fill:var(--l4); }
.box.lvl-Class .shape{ fill:var(--l5); }
.box.lvl-Function .shape{ fill:var(--l6); }
.box.external .shape{ stroke-dasharray:6 4; fill:var(--canvas); }
.box .fold{ fill:var(--l2); stroke:var(--stroke); stroke-width:1; }
.box .classbar{ fill:var(--stroke); opacity:.55; }
.box text{ font-family:var(--font); fill:var(--ink); pointer-events:none; }
.box .name{ font-size:13px; font-weight:600; }
.box.open > .label .name{ font-size:14px; }
.box .tag{ font-size:11px; fill:var(--muted); }
.box .rel{ font-size:11px; font-weight:600; }
.box .tog rect{ fill:var(--surface); stroke:var(--stroke); }
.box .tog path{ stroke:var(--ink); stroke-width:1.6; fill:none; }
.box .tog:hover rect{ fill:var(--l3); }
.box:focus{ outline:none; }
.box:focus-visible > .shape{ stroke:var(--dep); stroke-width:3; }
.box.sel > .shape{ stroke:var(--ink); stroke-width:3.5; }
.box.dep > .shape{ stroke:var(--dep); stroke-width:3; }
.box.use > .shape{ stroke:var(--use); stroke-width:3; }
.box.both > .shape{ stroke:var(--both); stroke-width:3; }
.box.dep .rel{ fill:var(--dep); } .box.use .rel{ fill:var(--use); } .box.both .rel{ fill:var(--both); }
.box.dim > .shape, .box.dim > .label, .box.dim > .fold, .box.dim > .classbar, .box.dim > .mark{ opacity:.28; }
.mark rect{ stroke-width:1.2; }
.mark text{ font-size:11px; font-weight:600; }
.mark.added rect{ fill:var(--addedbg); stroke:var(--added); } .mark.added text{ fill:var(--added); }
.mark.changed rect{ fill:var(--changedbg); stroke:var(--changed); } .mark.changed text{ fill:var(--changed); }
.mark.inside rect{ fill:var(--surface); stroke:var(--changed); stroke-dasharray:3 2; } .mark.inside text{ fill:var(--changed); }

/* Edges */
.edge{ fill:none; stroke:var(--edge); stroke-width:1.3; opacity:.45; pointer-events:none; }
.edge.t-imports{ stroke-dasharray:2 4; }
.edge.t-reads, .edge.t-writes{ stroke-dasharray:8 4; }
.edge.t-sends, .edge.t-receives{ stroke-dasharray:10 4 2 4; }
.edges.hidden .edge:not(.dep):not(.use){ display:none; }
.edge.dim{ opacity:.07; }
.edge.dep{ stroke:var(--dep); stroke-width:2.4; opacity:1; }
.edge.use{ stroke:var(--use); stroke-width:2.4; opacity:1; }
.arrow-default{ fill:var(--edge); } .arrow-dep{ fill:var(--dep); } .arrow-use{ fill:var(--use); }

.zoom{ position:absolute; right:12px; bottom:12px; display:flex; flex-direction:column; gap:4px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:4px; }

.hint{ color:var(--muted); }

.panel dd li{ margin:2px 0; }
.panel code{ font:12.5px/1.4 var(--mono); }
.panel .none{ color:var(--muted); }
.panel .unknown{ color:var(--unknown); background:var(--unknownbg); padding:0 5px; border-radius:4px; font-weight:600; }
.panel .reflist{ list-style:none; padding:0; }
.panel .reflist li{ display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 6px; padding:3px 0; border-bottom:1px solid var(--line); }
.panel .reflist li:last-child{ border-bottom:0; }
.panel .ref{ border:0; background:none; padding:0; cursor:pointer; font-weight:600; text-align:left; text-decoration:underline; text-decoration-color:var(--line); text-underline-offset:3px; }

.panel .reflist.dep .ref{ color:var(--dep); }
.panel .reflist.use .ref{ color:var(--use); }
.panel .small{ font-size:12px; color:var(--muted); }
.panel .more{ margin-top:6px; }
.panel .close{ float:right; }
.panel h3{ font-size:13px; margin:22px 0 6px; padding-top:12px; border-top:1px solid var(--line); }
.panel .hist{ list-style:none; padding:0; margin:0; }
.panel .hist > li{ padding:8px 0; border-bottom:1px solid var(--line); }
.panel .hist > li:last-child{ border-bottom:0; }

.panel .h-kind{ font-weight:600; }
.panel .h-kind.added{ color:var(--added); } .panel .h-kind.changed{ color:var(--changed); }
.panel .h-links{ list-style:none; padding:0; margin:4px 0 0; font-size:13px; }

.panel .linkish{ border:0; background:none; padding:0; cursor:pointer; color:var(--dep); text-decoration:underline; font-size:12px; }

@media (max-width: 760px){

  .search{ flex:1 1 100%; order:3; }
  .legend{ display:none; }

ns the database, registers the media protocol and all IPC handlers, and opens the window.","location":["src/main/index.ts:180"],"depends_on":[{"id":"src/main/settings.ts::getThemeSource","type":"calls"},{"id":"src/main/settings.ts::setThemeSource","type":"calls"},{"id":"src/main/settings.ts::getSettings","type":"calls"},{"id":"src/main/settings.ts::updateSettings","type":"calls"},{"id":"src/main/db.ts::getDb","type":"calls"},{"id":"src/main/index.ts::mediaProtocolHandler","type":"calls"},{"id":"src/main/posts.ts::listEntries","type":"calls"},{"id":"src/main/posts.ts::getPostBySlug","type":"calls"},{"id":"src/main/posts.ts::createPost","type":"calls"},{"id":"src/main/posts.ts::updatePost","type":"calls"},{"id":"src/main/posts.ts::updateBrainstorm","type":"calls"},{"id":"src/main/posts.ts::deletePost","type":"calls"},{"id":"src/main/posts.ts::listRevisions","type":"calls"},{"id":"src/main/posts.ts::getRevision","type":"calls"},{"id":"src/main/posts.ts::revertToRevision","type":"calls"},{"id":"src/main/posts.ts::listCategoriesWithCounts","type":"calls"},{"id":"src/main/posts.ts::createCategory","type":"calls"},{"id":"src/main/posts.ts::renameCategory","type":"calls"},{"id":"src/main/posts.ts::deleteCategory","type":"calls"},{"id":"src/main/posts.ts::reorderCategories","type":"calls"},{"id":"src/main/posts.ts::updateCategoryDescription","type":"calls"},{"id":"src/main/posts.ts::setCategoryFavorite","type":"calls"},{"id":"src/main/media.ts::importMedia","type":"calls"},{"id":"src/main/index.ts::buildMenu","type":"calls"},{"id":"src/main/index.ts::createWindow","type":"calls"},{"id":"src/preload/index.ts::api","type":"sends"}],"data_in":"IPC invoke calls with their arguments","data_out":"IPC replies; theme:updated events to every window","notes":"An anonymous callback passed to app.whenReady().then(). IPC handlers pass arguments straight through without checks. The categories:contextMenu handler shows a native Rename/Delete menu and resolves to the choice or null.","signa     sel.value = String(since);
    sel.addEventListener('change', () => {
      since = sel.value === '' ? null : (sel.value === 'pending' ? 'pending' : Number(sel.value));
      computeChanges(); render(); renderPanel();
    });
    $('since-wrap').hidden = false;
  }
  let resizeT = null;
  window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(applyView, 100); });

  // ---------- Start ----------
  if (meta.project) { $('proj').textContent = meta.project; document.title = meta.project + ' architecture'; }
  const metaBits = [];
  if (meta.generated_from_commit) metaBits.push('Commit ' + String(meta.generated_from_commit).slice(0, 7) + (meta.dirty ? ' with uncommitted changes' : ''));
  if (meta.generated_at) metaBits.push('built ' + meta.generated_at);
  if (revisions.length) metaBits.push('rev ' + revisions[revisions.length - 1].rev);
  $('meta').textContent = metaBits.join(', ');
  renderLegend();
  if (!byId.size) {
    stage.appendChild(h('div', { class: 'empty' }, h('p', null, RAW ? 'The data has no components. Add components to architecture.json, then run scripts/build.py.' : 'No data found. Run scripts/build.py to put architecture.json into this page.')));
  }
  if (problems.length) {
    const uniq = [...new Set(problems)];
    stage.appendChild(h('details', { class: 'banner' },
      h('summary', { text: uniq.length + ' data problem' + (uniq.length > 1 ? 's' : '') + ' found. Run scripts/validate.py to see and fix them.' }),
      h('ul', null, ...uniq.slice(0, 50).map((p) => h('li', { text: p })))));
  }
  layout(); render(); renderPanel(); renderCrumbs();
  requestAnimationFrame(() => fitAll(false));
  window.__arch = { select, jumpTo, toggle, view, geo, expanded };
})();
</script>
</body>
</html>
